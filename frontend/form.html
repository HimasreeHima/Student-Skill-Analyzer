<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Skill Analyzer</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/form.css">

</head>

<body>

<div class="container">

    <h1>Student Skill Analyzer</h1>

    <p class="subtitle">
        Fill your details to receive personalized career recommendations.
    </p>

    <form id="studentForm">

        <!-- ===================== -->
        <!-- Personal Information -->
        <!-- ===================== -->

        <div class="card">

            <h2>Personal Information</h2>

            <div class="input-group">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

            </div>

            <div class="input-group">

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required>

            </div>

            <div class="input-group">

                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required>

            </div>

        </div>

        <!-- ===================== -->
        <!-- Academic Information -->
        <!-- ===================== -->

        <div class="card">

            <h2>Academic Information</h2>

            <div class="input-group">

                <label>Branch</label>

                <select id="branch">

                    <option>CSE</option>
                    <option>CSM</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>IT</option>
                    <option>MECH</option>
                    <option>CIVIL</option>

                </select>

            </div>

            <div class="input-group">

                <label>Year</label>

                <select id="year">

                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>

                </select>

            </div>

            <div class="input-group">

                <label>CGPA</label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    max="10"
                    id="cgpa"
                    placeholder="Example : 8.75">

            </div>

        </div>

        <!-- ===================== -->
        <!-- Technical Skills -->
        <!-- ===================== -->

        <div class="card">

            <h2>Technical Skills</h2>

            <div class="checkbox-grid">

                <label><input type="checkbox" name="technical" value="Python">Python</label>

                <label><input type="checkbox" name="technical" value="Java">Java</label>

                <label><input type="checkbox" name="technical" value="C++">C++</label>

                <label><input type="checkbox" name="technical" value="JavaScript">JavaScript</label>

                <label><input type="checkbox" name="technical" value="HTML">HTML</label>

                <label><input type="checkbox" name="technical" value="CSS">CSS</label>

                <label><input type="checkbox" name="technical" value="SQL">SQL</label>

                <label><input type="checkbox" name="technical" value="DBMS">DBMS</label>

                <label><input type="checkbox" name="technical" value="DSA">DSA</label>

                <label><input type="checkbox" name="technical" value="Python Libraries">Python Libraries</label>

            </div>

        </div>

        <!-- ===================== -->
        <!-- Soft Skills -->
        <!-- ===================== -->

        <div class="card">

            <h2>Soft Skills</h2>

            <div class="checkbox-grid">

                <label><input type="checkbox" name="soft" value="Communication">Communication</label>

                <label><input type="checkbox" name="soft" value="Leadership">Leadership</label>

                <label><input type="checkbox" name="soft" value="Teamwork">Teamwork</label>

                <label><input type="checkbox" name="soft" value="Problem Solving">Problem Solving</label>

                <label><input type="checkbox" name="soft" value="Time Management">Time Management</label>

                <label><input type="checkbox" name="soft" value="Critical Thinking">Critical Thinking</label>

            </div>

        </div>

        <!-- ===================== -->
        <!-- Career Interests -->
        <!-- ===================== -->

        <div class="card">

            <h2>Career Interests</h2>

            <div class="checkbox-grid">

                <label><input type="checkbox" name="interest" value="AI/ML">AI / ML</label>

                <label><input type="checkbox" name="interest" value="Data Science">Data Science</label>

                <label><input type="checkbox" name="interest" value="Web Development">Web Development</label>

                <label><input type="checkbox" name="interest" value="Cyber Security">Cyber Security</label>

                <label><input type="checkbox" name="interest" value="Cloud Computing">Cloud Computing</label>

                <label><input type="checkbox" name="interest" value="Software Development">Software Development</label>

                <label><input type="checkbox" name="interest" value="DevOps">DevOps</label>

            </div>

        </div>

        <!-- ===================== -->
        <!-- Submit -->
        <!-- ===================== -->

        <button type="submit">

            Analyze My Skills

        </button>

    </form>

</div>

<script src="js/form.js"></script>

</body>

</html>
