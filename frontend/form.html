<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Skill Analyzer | Student Form</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/form.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav class="navbar">

            <h2 class="logo">
                Student Skill Analyzer
            </h2>

            <a href="index.html" class="back-btn">
                ← Back to Home
            </a>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <div class="container">

            <h1>Student Details</h1>

            <p class="subtitle">
                Fill in your information to receive personalized career recommendations.
            </p>

            <!-- ================= FORM ================= -->

            <form id="studentForm">

                <!-- Personal Information -->

                <h2>Personal Information</h2>

                <div class="input-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>

                <div class="input-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="input-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your mobile number">

                </div>

                <div class="input-group">

                    <label for="college">College Name</label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name">

                </div>

                <div class="input-group">

                    <label for="branch">Branch</label>

                    <select id="branch">

                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>

                    </select>

                </div>

                <div class="input-group">

                    <label for="year">Year</label>

                    <select id="year">

                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>

                    </select>

                </div>

                <div class="input-group">

                    <label for="cgpa">CGPA</label>

                    <input
                        type="number"
                        id="cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Example: 8.75">

                </div>

                <!-- Technical Skills -->

                <h2>Technical Skills</h2>

                <div class="input-group">

                    <label for="skills">
                        Programming Languages & Technologies
                    </label>

                    <textarea
                        id="skills"
                        rows="4"
                        placeholder="Example: Java, Python, HTML, CSS, JavaScript, SQL"></textarea>

                </div>

                <!-- Projects -->

                <div class="input-group">

                    <label for="projects">
                        Projects Completed
                    </label>

                    <textarea
                        id="projects"
                        rows="3"
                        placeholder="Mention your projects"></textarea>

                </div>

                <!-- Soft Skills -->

                <h2>Soft Skills</h2>

                <div class="input-group">

                    <label for="softskills">

                        Soft Skills

                    </label>

                    <textarea
                        id="softskills"
                        rows="3"
                        placeholder="Communication, Leadership, Teamwork, Problem Solving"></textarea>

                </div>

                <!-- Career Interest -->

                <h2>Career Interest</h2>

                <div class="input-group">

                    <label for="career">

                        Preferred Career

                    </label>

                    <select id="career">

                        <option>Software Developer</option>

                        <option>Web Developer</option>

                        <option>Data Scientist</option>

                        <option>Machine Learning Engineer</option>

                        <option>AI Engineer</option>

                        <option>Cyber Security Engineer</option>

                        <option>Cloud Engineer</option>

                        <option>DevOps Engineer</option>

                    </select>

                </div>

                <!-- Submit -->

                <button type="submit">

                    Analyze My Skills

                </button>

            </form>

        </div>

    </main>

    <!-- JavaScript -->

    <script src="js/form.js"></script>

</body>

</html>
