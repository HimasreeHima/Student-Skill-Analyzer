<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analysis Result | Student Skill Analyzer</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/result.css">

</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <h1>Student Skill Analyzer</h1>

        <p>Your Personalized Career Analysis Report</p>

    </header>



    <!-- ================= PROFILE ================= -->

    <section class="card">

        <h2>👤 Student Information</h2>

        <div class="profile-grid">

            <div>

                <strong>Name</strong>

                <p id="studentName">-</p>

            </div>

            <div>

                <strong>Email</strong>

                <p id="studentEmail">-</p>

            </div>

            <div>

                <strong>Phone</strong>

                <p id="studentPhone">-</p>

            </div>

            <div>

                <strong>Branch</strong>

                <p id="studentBranch">-</p>

            </div>

            <div>

                <strong>Year</strong>

                <p id="studentYear">-</p>

            </div>

            <div>

                <strong>CGPA</strong>

                <p id="studentCGPA">-</p>

            </div>

        </div>

    </section>



    <!-- ================= CAREER ================= -->

    <section class="card">

        <h2>💼 Career Recommendation</h2>

        <div class="career-box">

            <h3 id="careerRecommendation">

                Machine Learning Engineer

            </h3>

        </div>

    </section>



    <!-- ================= TECHNICAL SKILLS ================= -->

    <section class="card">

        <h2>💻 Technical Skills</h2>

        <div id="technicalSkills"

             class="badge-container">

        </div>

    </section>



    <!-- ================= SOFT SKILLS ================= -->

    <section class="card">

        <h2>🤝 Soft Skills</h2>

        <div id="softSkills"

             class="badge-container">

        </div>

    </section>



    <!-- ================= IMPROVEMENT ================= -->

    <section class="card">

        <h2>📈 Improvement Areas</h2>

        <ul id="improvementList">

        </ul>

    </section>



    <!-- ================= COURSES ================= -->

    <section class="card">

        <h2>📚 Recommended Courses</h2>

        <ul id="courseList">

        </ul>

    </section>



    <!-- ================= ACTION BUTTONS ================= -->

    <section class="button-group">

        <button onclick="goBack()">

            Analyze Another Student

        </button>

    </section>

</div>



<script src="js/result.js"></script>

</body>

</html>
